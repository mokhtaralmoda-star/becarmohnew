<script>
(function () {
  function panel(t) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:2147483647;background:rgba(0,0,0,.82);color:#6f6;font:11px monospace;padding:6px 8px;border-radius:8px;white-space:pre-wrap;direction:ltr;max-height:34vh;overflow:hidden;pointer-events:none';
    d.textContent = t;
    (document.body || document.documentElement).appendChild(d);
    setTimeout(function () { if (d.parentNode) d.remove(); }, 9000);
  }
  window.addEventListener('error', function (e) {
    var tg = e.target;
    if (tg && tg !== window && tg.tagName) {
      if ((tg.src || '').indexOf('cloudflareinsights') !== -1) return;
      panel('RESOURCE FAIL: ' + (tg.src || tg.href || ''));
      return;
    }
    panel('ERR: ' + (e.message || '') + ' @ ' + (e.lineno || ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    panel('REJ: ' + ((e.reason && (e.reason.message)) || e.reason || ''));
  });
})();
</script>
